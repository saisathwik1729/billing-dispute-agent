# Render Blueprint (free plan): New > Blueprint, point it at this repository.
# Everything here runs on free tiers: Render free web service, Neon free Postgres, Gemini free API.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: billing-dispute-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon / Render Postgres connection string
      - key: LLM_PROVIDER
        value: gemini          # Google Gemini free tier (no billing needed)
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false            # key from aistudio.google.com
      - key: AUTH_SECRET
        generateValue: true
      - key: REVIEWER_ACCOUNTS
        sync: false          # e.g. reviewer:some-password,lead:another-password
      - key: MAX_ANALYSIS_RUNS_PER_HOUR
        value: "40"
      - key: ALLOW_FAILURE_SIMULATION
        value: "true"
      - key: SEED_SAMPLE_CASES
        value: "true"
      - key: LOG_LEVEL
        value: INFO
